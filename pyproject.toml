[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csi500-reversal-turnover"
version = "0.1.0"
description = "Pre-registered single-factor study: 20-day reversal x turnover on CSI 500 constituents, public data"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Zhu" }]
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "scipy>=1.14,<2",
    "pyarrow>=17,<27",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
# Network data adapters. BaoStock needs no account; its rules forbid concurrent connections.
data = ["baostock>=0.9.4,<1", "akshare>=1.17,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
revturn = "revturn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/revturn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
